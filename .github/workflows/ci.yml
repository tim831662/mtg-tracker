name: Checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mtg
          POSTGRES_PASSWORD: mtg_local
          POSTGRES_DB: mtg_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtg -d mtg_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://mtg:mtg_local@127.0.0.1:5432/mtg_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mtg_tracker
      POSTGRES_USER: mtg
      POSTGRES_PASSWORD: mtg_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg -d mtg_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
